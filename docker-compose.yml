services:
  # ── SQL Server ────────────────────────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: "Developer"           # Free Developer edition (not for production)
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql  # Persist database files
      - ./docker/sqlserver/init:/docker-entrypoint-initdb.d:ro  # Init scripts (read-only)
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -Q 'SELECT 1' || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - agent_network

  # ── SQL Server Init (creates DB + seed data) ──────────────────────────────────
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agent_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_PASSWORD:-YourStrong!Passw0rd}"
      SQL_DATABASE: "${SQL_DATABASE:-AgentDB}"
    volumes:
      - ./docker/sqlserver/init:/init:ro
    command: >
      bash -c "
        echo '⏳ Waiting for SQL Server to be fully ready...' &&
        sleep 5 &&
        echo '🗄️  Creating database and schema...' &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -i /init/01_create_database.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -d \"$${SQL_DATABASE}\" -i /init/02_create_tables.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$${MSSQL_SA_PASSWORD}\" -No -d \"$${SQL_DATABASE}\" -i /init/03_seed_data.sql &&
        echo '✅ Database initialized successfully!'
      "
    networks:
      - agent_network
    restart: "no"    # Run once and exit

  # ── App (Node.js Agent Server) ────────────────────────────────────────────────
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: agent_app
  #   restart: unless-stopped
  #   depends_on:
  #     sqlserver:
  #       condition: service_healthy
  #     sqlserver-init:
  #       condition: service_completed_successfully
  #   env_file:
  #     - .env
  #   environment:
  #     # Override SQL host to point to the container name (not localhost)
  #     SQL_SERVER: "sqlserver"
  #     SQL_PORT: "1433"
  #     SQL_ENCRYPT: "false"                   # No SSL inside Docker network
  #     SQL_TRUST_SERVER_CERTIFICATE: "true"   # Required for self-signed Docker cert
  #   ports:
  #     - "${PORT:-3000}:3000"
  #   networks:
  #     - agent_network

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  sqlserver_data:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  agent_network:
    driver: bridge
